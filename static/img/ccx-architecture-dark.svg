<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" role="img" aria-labelledby="ccxArchTitle ccxArchDesc" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="ccxArchTitle">CCX architecture: control plane and data plane</title>
<desc id="ccxArchDesc">The CCX control plane runs in Kubernetes and holds entry points, core services, metadata databases, platform services and observability. The data plane holds per-customer datastores of database nodes on cloud infrastructure. The control plane manages and monitors nodes over their public addresses, while nodes replicate to each other over their private addresses. Nodes ship backups to S3 and forward logs and metrics back to the control plane.</desc>
