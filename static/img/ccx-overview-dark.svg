<title id="ccxOvTitle">CCX architecture at a glance</title>
<desc id="ccxOvDesc">Application teams and the platform team use the CCX control plane, which runs on your Kubernetes and provides self-service, lifecycle automation, backup and recovery, and observability. The control plane deploys, manages and monitors datastores in your own cloud: replicated, encrypted clusters that back up to S3-compatible storage. Applications connect directly to the datastores, never through the control plane.</desc>
